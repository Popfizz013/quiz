<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illawarra Wind Stakeholder Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: single mobile-first column, one question per screen, like a sea-chart card held in the hand */
:root{
  --bg:#eaf2f7; --surface:#ffffff; --fg:#0c2433; --muted:#4b6677; --line:#c9dae5;
  --accent:#155f86; --accent-ink:#ffffff; --signal:#f2b632;
  --investors:#6a5bb5; --enviro:#2f8f5b; --community:#b5562a; --alt:#9a7400;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081722; --surface:#0f2534; --fg:#e2eef5; --muted:#9bb4c4; --line:#21405a;
  --accent:#6cbbe3; --accent-ink:#05202e; --signal:#f5c451;
  --investors:#a497ea; --enviro:#5cc48a; --community:#e8925f; --alt:#e0b84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081722; --surface:#0f2534; --fg:#e2eef5; --muted:#9bb4c4; --line:#21405a;
  --accent:#6cbbe3; --accent-ink:#05202e; --signal:#f5c451;
  --investors:#a497ea; --enviro:#5cc48a; --community:#e8925f; --alt:#e0b84a; color-scheme:dark}
*{box-sizing:border-box} body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:24px 48px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,8vw,2.8rem);font-weight:800}
h2{font-size:clamp(1.4rem,5.5vw,1.8rem);font-weight:700}
p{margin:0}
.lede{color:var(--muted);max-width:60ch}
.whale{width:min(340px,100%);height:auto;color:var(--accent);overflow:visible}
.turbines{color:var(--muted)}
.blades{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.blades{animation:none}}
.whale .body{animation:swim 4s ease-in-out infinite}
.whale .spout{animation:spout 4s ease-in-out infinite;transform-origin:30px 22px}
.whale .wave{stroke:var(--line)}
@keyframes swim{50%{transform:translateY(-4px) rotate(-1.5deg)}}
@keyframes spout{0%,60%,100%{opacity:0;transform:scaleY(.4)}20%,40%{opacity:1;transform:scaleY(1)}}
.fluke{width:40px;height:auto;color:var(--role);align-self:flex-end;margin-top:-4px}
@media (prefers-reduced-motion:reduce){.whale .body,.whale .spout{animation:none}}
body{background-image:radial-gradient(ellipse 120% 40% at 50% 100%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);background-attachment:fixed}
/* --- Bubbles rising in the background --- */
.sea{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sea i{position:absolute;bottom:-40px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent);animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--drift),-115vh)}}
main{position:relative;z-index:1}
/* --- Screen transitions --- */
.screen{display:flex;flex-direction:column;gap:20px;animation:enter .45s cubic-bezier(.2,.8,.3,1.2) both}
.screen.leave{animation:leave .3s ease-in forwards}
@keyframes enter{from{transform:translateX(40px) scale(.98);opacity:.2}}
@keyframes leave{to{transform:translateX(-40px);opacity:0}}
/* --- Progress: a little whale swimming along the line --- */
.voyage{position:relative;height:34px}
.voyage .track{position:absolute;left:0;right:0;bottom:6px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.voyage .track span{display:block;height:100%;width:var(--from);background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,color-mix(in srgb,var(--accent) 75%,var(--surface)) 8px 16px);border-radius:4px;animation:fillto .7s cubic-bezier(.3,1.4,.5,1) .1s forwards}
.voyage .mini{position:absolute;bottom:2px;left:var(--from);width:34px;margin-left:-17px;color:var(--accent);animation:swimto .7s cubic-bezier(.3,1.4,.5,1) .1s forwards}
.voyage .mini svg{display:block;animation:bob 1.6s ease-in-out infinite}
@keyframes fillto{to{width:var(--to)}}
@keyframes swimto{to{left:var(--to)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots b{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .2s}
.dots b.done{background:var(--accent)}
.dots b.now{background:var(--signal);transform:scale(1.3)}
/* --- Answer cards --- */
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.options{grid-template-columns:1fr}}
.opt{all:unset;position:relative;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;font-size:1rem;line-height:1.35;transition:transform .18s cubic-bezier(.3,1.6,.5,1),border-color .15s,box-shadow .18s;animation:pop .4s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 70ms + 120ms);overflow:hidden}
@keyframes pop{from{transform:translateY(14px) scale(.94);opacity:0}}
.opt:hover{transform:translateY(-3px) rotate(var(--tilt));border-color:var(--accent);box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
.opt:active{transform:translateY(1px) scale(.98);border-bottom-width:2px}
.opt:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.opt .key{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);font-family:var(--display);font-weight:800;transition:background .15s,color .15s}
.opt:hover .key{background:var(--accent);color:var(--accent-ink)}
.opt.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface));animation:picked .45s cubic-bezier(.3,1.8,.5,1)}
.opt.picked .key{background:var(--accent);color:var(--accent-ink)}
.opt.faded{opacity:.35;transform:scale(.97)}
@keyframes picked{40%{transform:scale(1.05) rotate(-1deg)}}
.pop{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);pointer-events:none;animation:burst .6s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.hint{font-size:.85rem;color:var(--muted)}
.hint kbd{font-family:var(--display);font-weight:700;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;background:var(--surface)}
@media (hover:none){.hint{display:none}}
/* --- Buttons --- */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{all:unset;cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.05rem;padding:14px 28px;border-radius:999px;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,var(--fg));transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 color-mix(in srgb,var(--accent) 55%,var(--fg))}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,var(--fg))}
.btn.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,var(--fg)),0 0 0 10px color-mix(in srgb,var(--accent) 18%,transparent)}}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);padding:10px 20px;font-size:.95rem}
.btn:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
/* --- Start screen extras --- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:999px;border:2px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));animation:pop .4s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 90ms + 200ms)}
h1 .wave-word{display:inline-block;color:var(--accent);animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-2deg)}}
/* --- Loading "diving" interlude --- */
.dive{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:40px;text-align:center}
.dive svg{width:120px;color:var(--accent);animation:dive 1.1s ease-in-out infinite}
@keyframes dive{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(10px) rotate(12deg)}100%{transform:translateY(0) rotate(0)}}
/* --- Result --- */
.role-card{position:relative;background:var(--surface);border:3px solid var(--role);border-bottom-width:7px;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;animation:reveal .7s cubic-bezier(.3,1.5,.5,1) both;overflow:hidden}
@keyframes reveal{from{transform:scale(.7) rotate(-4deg);opacity:0}}
.role-card::before{content:"";position:absolute;inset:auto -20% -60% -20%;height:90%;background:radial-gradient(ellipse at top,color-mix(in srgb,var(--role) 18%,transparent),transparent 70%);pointer-events:none}
.role-card > *{position:relative}
.role-name{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3rem);line-height:1;color:var(--role);text-wrap:balance;margin:0}
.role-tag{align-self:flex-start;background:var(--role);color:var(--surface);font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.role-card h3{font-family:var(--display);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.role-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.role-card li{display:flex;gap:10px;align-items:flex-start}
.role-card li::before{content:"";flex:none;width:10px;height:10px;margin-top:.45em;border-radius:50%;border:2.5px solid var(--role)}
.ask{background:color-mix(in srgb,var(--role) 12%,var(--surface));border-radius:14px;padding:14px 16px;font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.3}
.fluke{width:52px;height:auto;color:var(--role);align-self:flex-end;margin-top:-6px;animation:flip 2.4s ease-in-out infinite;transform-origin:bottom center}
@keyframes flip{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-3px)}}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,10rem) 1fr 2rem;align-items:center;gap:10px;font-size:.9rem;font-variant-numeric:tabular-nums}
.bar.win{font-weight:700}
.bar .track{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;width:0;border-radius:7px;transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.note{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 18px);z-index:6;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:1.3rem;padding:8px 20px;border-radius:999px;background:var(--signal);color:#1d1600;box-shadow:0 5px 0 color-mix(in srgb,var(--signal) 55%,#000);pointer-events:none;animation:toast .9s cubic-bezier(.3,1.6,.5,1) forwards;white-space:nowrap}
@keyframes toast{0%{transform:translate(-50%,-30px) scale(.6) rotate(-6deg);opacity:0}25%{transform:translate(-50%,0) scale(1.08) rotate(3deg);opacity:1}45%{transform:translate(-50%,0) scale(1) rotate(0)}80%{opacity:1}100%{transform:translate(-50%,-10px);opacity:0}}
.creature{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--role) 10%,var(--surface));border:2px dashed color-mix(in srgb,var(--role) 50%,transparent);border-radius:14px;padding:10px 14px}
.creature b{font-family:var(--display);color:var(--role)}
.creature .lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--display);font-weight:700;display:block}
.dive h2{min-height:2.4em}
.confetti{position:fixed;top:-20px;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:5;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){
  .sea,.confetti,.pop{display:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>
<div class="sea" id="sea" aria-hidden="true"></div>
<main id="app" aria-live="polite"></main>

<script>
/* ===== EDIT HERE: roles and questions =====
   Each option names the role it scores for. Highest total wins. */
const QUIZ = {
  title: "Which stakeholder are you?",
  titleHighlight: "stakeholder",
  intro: "Should the Illawarra offshore wind zone go ahead? The decision is still pending. Answer eleven quick questions to find out which stakeholder you'll argue as in today's debate.",
  roles: {
    investors: {
      name: "Private Investors", color: "--investors",
      verdict: "Approve immediately, in full",
      creature: "Swordfish", creatureLine: "Quick, decisive and always moving forward.",
      tagline: "Every month of delay costs millions.",
      about: "You're backing the project with real money. You want a fast, full approval so construction can start, contracts can be locked in and the Illawarra doesn't lose out to other offshore wind zones competing for the same investment.",
      argue: ["Delays push up costs and can send investment to other states", "Thousands of construction and maintenance jobs, plus a new industry at Port Kembla", "Clean power for the grid as coal plants close"],
      ask: "If we delay, what does it cost, and who pays for it?"
    },
    enviro: {
      name: "Environmental Advocates", color: "--enviro",
      verdict: "Approve now, with conditions",
      creature: "Humpback whale", creatureLine: "Big-hearted, but keeps an eye on the whole ocean.",
      tagline: "Clean power and a healthy ocean. We need both.",
      about: "You want the wind farm built because cutting emissions is urgent, but not at any cost to marine life. You'd approve it straight away, as long as firm environmental protections are written into the approval.",
      argue: ["Offshore wind is one of the biggest emissions cuts available to the region", "Protections can be made a legal condition of approval", "Doing nothing harms the ocean too, through warming and acidification"],
      conditions: ["Pause noisy construction during humpback whale migration season (roughly May to November)", "Independent marine monitoring of whales, seabirds and fish, with results made public", "Keep turbines and cables away from sensitive reefs and seabird foraging areas", "A decommissioning bond so the developer pays to remove turbines at end of life"],
      ask: "Will you commit to these conditions in writing, or only promise them?"
    },
    community: {
      name: "Indigenous and Local Community", color: "--community",
      verdict: "Delay for further consultation",
      creature: "Dolphin pod", creatureLine: "Nobody gets left behind, and everyone gets a say.",
      tagline: "Nothing about us without us.",
      about: "You speak for the Dharawal Traditional Owners of this sea country and the people who live along the coast. You aren't against the project, but it shouldn't go ahead until the people affected have genuinely had their say.",
      argue: ["Sea country holds cultural value that needs a full assessment", "Consultation needs more time to reach everyone affected", "Locals, fishers and surfers will live alongside the project for decades"],
      conditions: ["Free, prior and informed consent from Dharawal Traditional Owners before approval", "A cultural heritage assessment of the sea country in the zone", "Further independent research on whale migration and fishing impacts", "A community benefit-sharing agreement with local jobs and funding for coastal towns"],
      ask: "Who exactly was consulted, and did their answers change anything?"
    },
    alt: {
      name: "Alternative Energy Sector", color: "--alt",
      verdict: "Reject entirely",
      creature: "Octopus", creatureLine: "Eight arms and always has more than one option.",
      tagline: "There's more than one way to power the Illawarra.",
      about: "You represent the other energy industries that already supply the region, including coal, gas, solar and onshore wind. You think the offshore wind zone carries too much cost and risk, and that the region's power needs can be met by sources that are already working here.",
      argue: ["Coal and gas plants supply steady power in any weather, which keeps the grid stable", "Onshore solar and wind can usually be built faster and for less than offshore wind", "Offshore wind projects overseas have been cancelled or delayed over rising costs"],
      ask: "Why commit billions offshore when other energy sources are already available?"
    }
  },
  questions: [
    { q: "Breaking news: giant turbines might pop up off the Illawarra coast. Your gut reaction?",
      options: [["Great, this is going to be a massive development and advancement for New South Wales.","investors"],["Good idea, as long as it's done right for the ocean.","enviro"],["Who was asked about this, and when?","community"],["Why offshore? We already have other ways to power the region.","alt"]] },
    { q: "Which piece of evidence would sway you most?",
      options: [["A financial report showing how many jobs and how much return the project could create","investors"],["A marine ecology impact study","enviro"],["A report on Traditional Owner and community consultation","community"],["A cost comparison of every energy option, from gas to solar","alt"]] },
    { q: "Who should have the biggest say in the final decision?",
      options: [["The developers who carry the financial risk","investors"],["Scientists and environmental groups","enviro"],["Traditional Owners and people who live on the coast","community"],["Energy companies with decades of experience running the grid","alt"]] },
    { q: "What's the biggest risk in getting this decision wrong?",
      options: [["Losing the chance for NSW to lead the sustainable energy sector","investors"],["Building without protections for whales and seabirds","enviro"],["Rushing past Traditional Owners and locals","community"],["Higher power bills and a less reliable grid","alt"]] },
    { q: "It's a sunny Saturday in the Gong. Where are you?",
      options: [["Catching up on business news over a coffee","investors"],["A beach clean-up or whale watching","enviro"],["The local market or a community event","community"],["Watching the footy with mates from work","alt"]] },
    { q: "Which 2035 headline would make you proudest?",
      options: [["Illawarra wind farm delivers record returns","investors"],["Whales thrive alongside the turbines","enviro"],["Traditional Owners co-manage the wind zone","community"],["Illawarra powered by a mix of proven energy sources","alt"]] },
    { q: "The town hall meeting is getting spicy. You grab the mic and say…",
      options: [["Every month we wait adds millions to the cost.","investors"],["Yes, but only with proper protections written in.","enviro"],["Slow down. Not everyone has been heard yet.","community"],["Let's not bet everything on one project.","alt"]] },
    { q: "What should be attached to the project's approval?",
      options: [["Nothing extra. Approve it as it is.","investors"],["A pause on construction during migration season for animals in the Illawarra region","enviro"],["Sign-off from Dharawal Traditional Owners first","community"],["Nothing, because the project shouldn't go ahead","alt"]] },
    { q: "Doom-scrolling at 11pm. Which headline makes you stop?",
      options: [["Billion-dollar offshore wind deal signed","investors"],["Record albatross numbers spotted off Wollongong","enviro"],["Locals call for more say on the wind zone","community"],["New report questions the cost of offshore wind","alt"]] },
    { q: "What does a good outcome look like in 20 years?",
      options: [["A booming clean energy industry with strong returns","investors"],["Clean power and a healthy ocean","enviro"],["A project the community and Traditional Owners helped shape","community"],["A reliable energy mix that keeps local industry running","alt"]] },
    { q: "Final question! You get to name the wind farm. What's it called?",
      options: [["Illawarra Wind Capital","investors"],["Humpback Highway Wind","enviro"],["A name chosen with Dharawal Elders","community"],["No name needed. I'd put the money into other energy projects.","alt"]] }
  ]
};
/* ===== end of editable section ===== */

const app = document.getElementById("app");
let step = -1, answers = [], order = [];

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const tb = (x, hub, len, dur) => `<g class="turbine-mast"><path d="M${x} ${hub} L${x - 1.2} 80 M${x} ${hub} L${x + 1.2} 80"/>
    <g class="blades" style="transform-origin:${x}px ${hub}px;animation-duration:${dur}s"><path d="M${x} ${hub} l0 -${len}"/><path d="M${x} ${hub} l${(len * .866).toFixed(1)} ${len / 2}"/><path d="M${x} ${hub} l-${(len * .866).toFixed(1)} ${len / 2}"/></g>
    <circle cx="${x}" cy="${hub}" r="1.8" fill="currentColor" stroke="none"/></g>`;
const turbine = `<svg class="whale" viewBox="0 0 240 84" aria-hidden="true">
  <g class="turbines" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    ${tb(176, 34, 16, 5)}${tb(204, 44, 12, 6.5)}${tb(228, 52, 9, 4.2)}
  </g>
  <g class="spout" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <path d="M30 22 C 28 14, 22 10, 18 8"/><path d="M30 22 C 30 12, 30 8, 30 4"/><path d="M30 22 C 32 14, 38 10, 42 8"/></g>
  <g class="body">
    <path fill="currentColor" d="M10 44 C 14 28, 40 22, 70 26 C 92 29, 108 36, 122 34 L 138 20 C 142 28, 140 36, 132 40 L 148 48 C 138 50, 130 46, 124 44 C 110 58, 76 64, 46 60 C 26 58, 8 54, 10 44 Z"/>
    <path fill="currentColor" opacity=".55" d="M58 56 C 62 66, 70 72, 80 74 C 74 66, 70 60, 68 57 Z"/>
    <g fill="none" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round" opacity=".6">
      <path d="M18 52 C 34 57, 56 58, 74 56"/><path d="M22 55.5 C 36 59.5, 54 60.5, 68 59"/></g>
    <circle cx="26" cy="44" r="2.4" fill="var(--bg)"/>
  </g>
  <path class="wave" fill="none" stroke-width="2.5" stroke-linecap="round" d="M2 80 q 10 -6 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 18 0"/>
</svg>`;
const fluke = `<svg class="fluke" viewBox="0 0 40 28" aria-hidden="true"><path fill="currentColor" d="M20 28 C 19 20, 18 14, 14 10 C 9 5, 3 6, 0 2 C 8 0, 16 2, 20 8 C 24 2, 32 0, 40 2 C 37 6, 31 5, 26 10 C 22 14, 21 20, 20 28 Z"/></svg>`;

const miniWhale = `<svg viewBox="0 0 160 70" aria-hidden="true"><path fill="currentColor" d="M10 44 C 14 28, 40 22, 70 26 C 92 29, 108 36, 122 34 L 138 20 C 142 28, 140 36, 132 40 L 148 48 C 138 50, 130 46, 124 44 C 110 58, 76 64, 46 60 C 26 58, 8 54, 10 44 Z" transform="scale(-1,1) translate(-158,0)"/><circle cx="132" cy="44" r="4" fill="var(--bg)"/></svg>`;
const KEYS = ["A", "B", "C", "D"];
const CHEERS = ["Splash!", "Fin-tastic!", "Krill-iant!", "Shell yeah!", "Making waves!", "Whale done!", "Sea-riously good", "Oh buoy!", "Turbine-ly great", "Nailed it!"];
const DIVE_LINES = ["Diving for your result…", "Consulting the whales…", "Counting krill…", "Reading the tides…"];
function cheer() {
  if (reduced) return;
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
  document.body.appendChild(t); setTimeout(() => t.remove(), 950);
}
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy = false;

/* Rising bubbles */
(() => {
  const sea = document.getElementById("sea");
  for (let i = 0; i < 18; i++) {
    const b = document.createElement("i"), size = 6 + Math.random() * 22;
    b.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-duration:${10 + Math.random() * 14}s;animation-delay:-${Math.random() * 20}s;--drift:${(Math.random() - .5) * 80}px`;
    sea.appendChild(b);
  }
})();

/* Swap screens with a slide */
function show(html, after) {
  const old = app.firstElementChild;
  const put = () => {
    app.innerHTML = `<section class="screen">${html}</section>`;
    after && after();
    window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
  };
  if (old && !reduced) { old.classList.add("leave"); setTimeout(put, 260); } else put();
}

function burst(el, color) {
  if (reduced) return;
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 10; i++) {
    const d = document.createElement("span"), a = Math.PI * 2 * i / 10, dist = 40 + Math.random() * 30;
    d.className = "pop";
    d.style.cssText = `left:${r.width / 2 - 5}px;top:${r.height / 2 - 5}px;--dx:${Math.cos(a) * dist}px;--dy:${Math.sin(a) * dist}px;border-color:${color || "var(--accent)"}`;
    el.appendChild(d);
    setTimeout(() => d.remove(), 650);
  }
}

function confetti(colorVar) {
  if (reduced) return;
  const cols = [colorVar, "--accent", "--signal", colorVar];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement("span"), s = 6 + Math.random() * 10;
    c.className = "confetti";
    c.style.cssText = `left:${Math.random() * 100}vw;width:${s}px;height:${s}px;background:var(${cols[i % 4]});animation-duration:${1.8 + Math.random() * 1.6}s;animation-delay:${Math.random() * .5}s;--dx:${(Math.random() - .5) * 200}px;border-radius:${Math.random() > .5 ? "50%" : "3px"}`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

function start() {
  const title = esc(QUIZ.title).replace(QUIZ.titleHighlight, `<span class="wave-word">${QUIZ.titleHighlight}</span>`);
  show(`${turbine}
    <div class="eyebrow"><span>Illawarra offshore wind</span><span>${QUIZ.questions.length} questions · 2 min</span></div>
    <h1>${title}</h1>
    <p class="lede">${esc(QUIZ.intro)}</p>
    <div class="chips">${Object.values(QUIZ.roles).map((r, i) => `<span class="chip" style="--c:var(${r.color});--i:${i}">${esc(r.name)}</span>`).join("")}</div>
    <div class="row"><button class="btn pulse" id="go">Dive in</button></div>`, () => {
    document.getElementById("go").onclick = () => { step = 0; answers = []; order = QUIZ.questions.map(q => shuffle(q.options)); render(-1); };
  });
}

function render(prev) {
  const n = QUIZ.questions.length, q = QUIZ.questions[step];
  const from = Math.max(0, prev ?? step) / n * 100, to = step / n * 100;
  busy = false;
  show(`
    <div class="eyebrow"><span>Question ${step + 1} of ${n}</span><span>${Math.round(to)}% to shore</span></div>
    <div class="voyage" style="--from:${from}%;--to:${to}%"><div class="track"><span></span></div><div class="mini">${miniWhale}</div></div>
    <h2>${esc(q.q)}</h2>
    <div class="options">${order[step].map((o, i) => `<button class="opt" data-i="${i}" style="--i:${i};--tilt:${i % 2 ? 1 : -1}deg"><span class="key">${KEYS[i]}</span><span>${esc(o[0])}</span></button>`).join("")}</div>
    <div class="row">${step > 0 ? `<button class="btn ghost" id="back">← Back</button>` : ""}<span class="hint">Tip: press <kbd>A</kbd>–<kbd>D</kbd> to answer</span></div>`, () => {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.i));
    const back = document.getElementById("back"); if (back) back.onclick = () => { if (busy) return; step--; render(step + 1); };
  });
}

function pick(i) {
  if (busy) return; busy = true;
  const n = QUIZ.questions.length;
  const btns = app.querySelectorAll(".opt");
  btns.forEach((b, j) => b.classList.add(j === i ? "picked" : "faded"));
  burst(btns[i]);
  cheer();
  answers[step] = order[step][i][1];
  setTimeout(() => { if (step < n - 1) { step++; render(step - 1); } else dive(); }, reduced ? 50 : 520);
}

function dive() {
  show(`<div class="dive">${miniWhale}<h2 id="diveline">${DIVE_LINES[0]}</h2><p class="note">Counting your answers</p></div>`);
  if (!reduced) [1, 2, 3].forEach(k => setTimeout(() => { const h = document.getElementById("diveline"); if (h) h.textContent = DIVE_LINES[k]; }, k * 450));
  setTimeout(result, reduced ? 50 : 1900);
}

function result() {
  const tally = Object.fromEntries(Object.keys(QUIZ.roles).map(k => [k, 0]));
  answers.forEach(a => tally[a]++);
  const max = Math.max(...Object.values(tally));
  // Tie-break: the latest answer among the tied roles wins
  const tied = Object.keys(tally).filter(k => tally[k] === max);
  const key = tied.length === 1 ? tied[0] : [...answers].reverse().find(a => tied.includes(a));
  const r = QUIZ.roles[key];
  show(`
    <div class="eyebrow"><span>You surfaced as…</span><span>${max} of ${answers.length} answers</span></div>
    <div class="role-card" style="--role:var(${r.color})">
      <span class="role-tag">Your position: ${esc(r.verdict)}</span>
      <p class="role-name">${esc(r.name)}</p>
      <h2>${esc(r.tagline)}</h2>
      <div class="creature"><span><span class="lbl">Your sea creature</span><b>${esc(r.creature)}.</b> ${esc(r.creatureLine)}</span></div>
      <p>${esc(r.about)}</p>
      <h3>Argue from</h3>
      <ul>${r.argue.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
      ${r.conditions ? `<h3>Your conditions</h3><ul>${r.conditions.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
      <h3>Put this to the other side</h3>
      <p class="ask">${esc(r.ask)}</p>
      ${fluke}
    </div>
    <h3 class="eyebrow"><span>Your full mix</span></h3>
    <div class="bars">${Object.entries(QUIZ.roles).map(([k, v]) => `
      <div class="bar${k === key ? " win" : ""}"><span>${esc(v.name)}</span><div class="track"><div class="fill" data-w="${tally[k] / answers.length * 100}" style="background:var(${v.color})"></div></div><span>${tally[k]}</span></div>`).join("")}</div>
    <p class="note">Show this screen to your facilitator so you can be grouped with your pod.</p>
    <div class="row"><button class="btn ghost" id="again">↻ Retake</button></div>`, () => {
    document.getElementById("again").onclick = start;
    setTimeout(() => app.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"), 500);
    confetti(r.color);
  });
}

document.addEventListener("keydown", e => {
  if (step < 0 || step >= QUIZ.questions.length || !app.querySelector(".opt") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  const i = KEYS.indexOf(k) >= 0 ? KEYS.indexOf(k) : ["1", "2", "3", "4"].indexOf(k);
  if (i >= 0 && i < order[step].length) pick(i);
});

start();
</script>
</body>
</html>
